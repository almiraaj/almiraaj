<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Embassy Attestation & Apostille Request | Almiraaj</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7f9;
    font-family:Arial,sans-serif;
}

.form-card{
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    overflow:hidden;
}

.form-header{
    background:#198754;
    color:#fff;
    padding:30px;
    text-align:center;
}

.form-header h1{
    font-size:32px;
    font-weight:700;
    margin-bottom:10px;
}

.form-body{
    padding:35px;
}

.form-control,
.form-select{
    height:50px;
}

textarea.form-control{
    height:auto;
}

.btn-submit{
    background:#198754;
    border:none;
    padding:14px;
    font-size:18px;
    font-weight:600;
}

.form-note{
    color:#6c757d;
    font-size:14px;
}

.required{
    color:red;
}

</style>
</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-9">

<div class="form-card">

<div class="form-header">

<h1>Embassy Attestation & Apostille Assistance</h1>

<p class="mb-0">
Submit your document details and our team will guide you with Apostille or Embassy Attestation requirements.
</p>

</div>

<div class="form-body">

<form action="https://formspree.io/f/xqegnwjq" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">
Full Name <span class="required">*</span>
</label>
<input type="text" class="form-control" name="Full Name" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
Mobile Number / WhatsApp <span class="required">*</span>
</label>
<input type="tel" class="form-control" name="Mobile Number" required>
</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" name="Email">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">
Destination Country <span class="required">*</span>
</label>
<input type="text"
class="form-control"
name="Destination Country"
placeholder="UAE, Qatar, Germany, France..."
required>
</div>

</div>

<div class="mb-3">
<label class="form-label">
Required Service <span class="required">*</span>
</label>

<select class="form-select"
name="Required Service"
required>

<option value="">
Select Service
</option>

<option>
Apostille (Hague Convention Country)
</option>

<option>
Embassy Attestation (Non-Hague Country)
</option>

<option>
Not Sure - Need Guidance
</option>

</select>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Document Category <span class="required">*</span>
</label>

<select class="form-select"
name="Document Category"
required>

<option value="">Select Category</option>

<option>Educational Certificate</option>

<option>Personal Certificate</option>

<option>Commercial Document</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Document Type <span class="required">*</span>
</label>

<select class="form-select"
name="Document Type"
required>

<option value="">Select Document</option>

<option>Degree Certificate</option>

<option>Diploma Certificate</option>

<option>Birth Certificate</option>

<option>Marriage Certificate</option>

<option>PCC</option>

<option>Experience Certificate</option>

<option>Nursing Certificate</option>

<option>Commercial Invoice</option>

<option>Power of Attorney</option>

<option>Other</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
Processing Requirement
</label>

<select class="form-select"
name="Processing Time">

<option>Normal</option>

<option>Urgent</option>

<option>Express</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Current Location
</label>

<input type="text"
class="form-control"
name="Location"
placeholder="Chennai, Madurai, Coimbatore">

</div>

</div>

<div class="mb-3">

<label class="form-label">
Additional Information
</label>

<textarea
class="form-control"
rows="5"
name="Message"
placeholder="Mention certificate details, number of documents, urgency, etc."></textarea>

</div>

<div class="form-note mb-4">

✅ Apostille Services for Hague Convention Countries

<br>

✅ Embassy Attestation for UAE, Qatar, Kuwait, Saudi Arabia and other Non-Hague Countries

</div>

<button
type="submit"
class="btn btn-submit btn-success w-100">

Submit Request

</button>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
